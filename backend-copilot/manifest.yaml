version: 0.0.3
type: plugin
author: xiaozhou
name: backend-copilot
label:
  en_US: Backend Copilot
  zh_Hans: 后端副驾驶
description:
  en_US: "Universal backend copilot for Dify: register your REST API catalog and let the agent query tickets, orders, users or any business data via natural language. Supports BladeX, RuoYi, custom Spring Boot backends. Read-only guardrails by default."
  zh_Hans: "通用后端副驾驶：登记接口目录后，Agent 用自然语言查询工单、订单、用户等任意业务数据。支持 BladeX、RuoYi、自研 Spring Boot 等任意 REST 后端。默认只读护栏。"
icon: icon.svg
icon_dark: icon-dark.svg
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    model:
      enabled: true
      llm: true
plugins:
  tools:
    - tools/backend.yaml
meta:
  version: 0.0.3
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: 1.9.0
created_at: 2026-09-16T00:00:00+08:00
privacy: PRIVACY.md
repo: https://atomgit.com/xiaozhou1123/backend-copilot
verified: true
